name: Fetch 3protv transcripts

on:
  schedule:
    # 주 실행은 매일 06:00 KST에 Claude 예약 작업이 workflow_dispatch로 직접 호출한다.
    # 아래 cron은 백업용 (UTC 기준, KST = UTC+9, GitHub 쪽 지연이 있을 수 있음)
    - cron: "30 13 * * *"  # 22:30 KST — 저녁 영상이 목록에서 밀리기 전에 미리 수집
    - cron: "40 20 * * *"  # 05:40 KST — 06:00 실행 전 백업 수집
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -U yt-dlp youtube-transcript-api

      - name: Fetch transcripts
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python scripts/fetch_transcripts.py

      - name: Commit
        if: always()
        run: |
          git config user.name "sampro-bot"
          git config user.email "sampro-bot@users.noreply.github.com"
          git add transcripts
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "transcripts: $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M') KST"
          git pull --rebase
          git push
