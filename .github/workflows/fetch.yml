name: Fetch 3protv transcripts

on:
  schedule:
    # GitHub cron은 UTC 기준 (KST = UTC+9), 실제 실행은 몇 분~수십 분 늦어질 수 있음
    - cron: "40 0 * * *"   # 09:40 KST — 아침 방송 다시보기 수집 → 리포트 직전
    - cron: "30 12 * * *"  # 21:30 KST — 오후·저녁 영상이 목록에서 밀리기 전에 수집
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -U yt-dlp youtube-transcript-api

      - name: Fetch transcripts
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python scripts/fetch_transcripts.py

      - name: Commit
        if: always()
        run: |
          git config user.name "sampro-bot"
          git config user.email "sampro-bot@users.noreply.github.com"
          git add transcripts
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "transcripts: $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M') KST"
          git pull --rebase
          git push
